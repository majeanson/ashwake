<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Rewritten by `ui/theme.ts` once the direction is resolved. -->
    <meta name="theme-color" content="#0a0806" />
    <title>Ashwake</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /*
       * The PRE-JS paint, and the only literal colour in the project.
       *
       * It is what a phone shows in the moment between the first byte and the
       * first render, so it cannot come from the theme — the theme is in the
       * bundle. It is the default direction's background, and `ui/theme.ts`
       * writes the resolved one over it at boot.
       */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0806;
      }
      body {
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
