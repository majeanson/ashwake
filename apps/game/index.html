<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <!--
      Portrait phone is the design target. `viewport-fit=cover` plus the
      env(safe-area-inset-*) padding in ui.css keeps the board clear of the
      notch and the home indicator.

      `user-scalable=no` is deliberately ABSENT (Ashwake 1, 2026-08-20): it is a
      WCAG 1.4.4 failure and an automatic Lighthouse failure, and it takes
      pinch-to-zoom away from anyone who needs it to read the board. What it was
      ever for is done properly elsewhere — `touch-action: none` on `.board-host`
      hands every board gesture to the game outright.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Rewritten by `ui/theme.ts` once the direction is resolved. -->
    <meta name="theme-color" content="#14100c" />

    <!--
      THE TWO FACES THE FRONT DOOR IS SET IN (2026-09-02).

      Both are self-hosted and declared with `font-display: swap`, so a browser
      cannot even ASK for them until it has fetched and parsed the stylesheet —
      which is behind the bundle, on a phone, on a first visit. Swap then does
      what it is for and paints the whole door in Georgia first, and re-lays it
      out when the real faces land. A flash of the wrong typeface on the one
      screen a stranger arrives on, and it is entirely a scheduling problem.

      Two, not three: Cinzel is every heading, every label and BEGIN itself, and
      EB Garamond is the prose under them. The italic is a third file that
      almost nothing on the door uses, and a preload that is not used within a
      few seconds is a warning in the console and a request taken from
      something that was.

      `crossorigin` is not optional on a font preload even from the same
      origin: fonts are fetched in CORS mode, and a preload without it is a
      SECOND download rather than a head start.
    -->
    <link rel="preload" href="/fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ebgaramond.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      The launch surfaces (restored 2026-08-29, auditing this body against
      Ashwake 1, which shipped all of them).

      `shell/share.ts` calls sharing "the game's entire distribution mechanism":
      there is no backend, no account and no store listing, so the game reaches
      a person because somebody pasted a link into a chat. This body shipped
      `og-image.png` — byte-identical to Ashwake 1's baked board scene — and
      nothing at all that told an unfurler it existed, so every shared link
      arrived blank.

      These sentences cannot come from `text/`, which is the one exception to
      D4 and worth stating: this is the PRE-JS head, read by a crawler that
      never runs the bundle. They are French because that is what `lang` above
      declares and what a device with no stored choice opens in; the catalogue's
      own `tagline` is the source they are copied from.
    -->
    <title>Ashwake · un établissement au bord d’une plaine noire</title>
    <meta
      name="description"
      content="Un établissement au bord d’une plaine noire. Pose, fais mûrir, récolte, et pousse plus loin."
    />
    <!-- Every path 200s with this page (SPA fallback, `wrangler.toml`), so
         every shared ?seed= and ?daily= link is a crawlable duplicate. The
         canonical keeps search engines pointed at the one front door. -->
    <link rel="canonical" href="https://ashwake.marcportal.com/" />
    <meta property="og:title" content="Ashwake" />
    <meta
      property="og:description"
      content="Un établissement au bord d’une plaine noire. Pose, fais mûrir, récolte, et pousse plus loin."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ashwake.marcportal.com/" />
    <meta property="og:site_name" content="Ashwake" />
    <meta
      property="og:image:alt"
      content="Une poche de tuiles hexagonales, ferme, marché, carrière et chemins, éclairée par ses propres lampes sur une plaine noire sans fin, le sol reconnu s’effaçant vers trois balises qui brillent."
    />
    <!-- A real baked share card (Ashwake 1's `scripts/social.ts`), not the
         install icon stretched wide — 1200x630 is the aspect every unfurl
         crops to, so this one does not get cropped. -->
    <meta property="og:image" content="https://ashwake.marcportal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ashwake.marcportal.com/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- PNG, not SVG: iOS ignores SVG here and falls back to a screenshot. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads its own trio, not the standard above: without these an
         added-to-home-screen Ashwake opens inside Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ashwake" />

    <!--
      The browser floor guard (Ashwake 1, 2026-08-20 launch audit).

      The bundle needs Safari/iOS 16.4-era syntax, and on anything older the
      entry MODULE fails to parse — including the error listener inside it —
      leaving a dark screen whose every control does nothing, forever, silently.
      A CLASSIC script parses everywhere back to ES5, so it is the one that
      speaks; the visitor gets one honest sentence instead of a game that looks
      broken.

      The colours are literals for the same reason the paint below is: this runs
      before the bundle that holds the theme exists.

      ## A MODULE PROBE, NOT `new Function` (2026-09-09)

      This guard used to be `try { new Function('class P { #m() {...} static {} }') }`,
      and `new Function` is EVAL. The moment `_headers` grew a Content Security
      Policy without `'unsafe-eval'` — which is the whole point of having one —
      the probe threw on every engine on earth, the catch ran, and **every
      visitor was told their browser was too old.** Caught by `e2e/csp.spec.ts`,
      which runs the game under the policy the edge will actually serve; it
      cannot be caught by `vite preview`, which serves no `_headers` at all.

      The replacement tests the same syntax by the same mechanism the bundle
      uses: an inline MODULE carrying private class methods, a static block and
      `??`. An engine that cannot parse that module never sets the flag —
      whether it failed on the syntax or has no module support at all, which
      are the two ways the entry bundle can fail to run. Module scripts are
      deferred, so this has executed by the time `DOMContentLoaded` fires, which
      is what makes the classic script below a valid reader of the flag.

      No eval, no external request, and it probes the real thing rather than a
      string that resembles it.
    -->
    <script type="module">
      // The newest syntax the shipped bundle actually uses. If this module does
      // not parse, nothing here runs and the classic script below speaks.
      class P {
        #m() {
          return 1 ?? 2;
        }
        static {}
      }
      void P;
      window.__ashwakeCanRun = true;
    </script>
    <script>
      if (!window.__ashwakeCanRun) {
        document.addEventListener('DOMContentLoaded', function () {
          if (window.__ashwakeCanRun) return;
          document.body.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            // The default direction's ground, like the pre-JS paint below —
            // this said `#0a0806` (torchlit's) for the same reason it did.
            'background:#14100c;color:#e8d6ae;font-family:Georgia,serif;padding:24px;text-align:center;">' +
            '<p style="max-width:26em;line-height:1.6">ASHWAKE a besoin d’un navigateur plus récent : ' +
            'iOS 16.4 ou plus, ou un Chrome ou Firefox à jour. ' +
            'Rien ne cloche avec ton appareil : ce jeu s’appuie sur les fonctions les plus récentes du moteur.<br><br>' +
            'ASHWAKE needs a newer browser: iOS 16.4 or later, or an up-to-date Chrome or Firefox.</p></div>';
        });
      }
    </script>

    <style>
      /*
       * The PRE-JS paint, and the only literal colour in the project.
       *
       * It is what a phone shows in the moment between the first byte and the
       * first render, so it cannot come from the theme — the theme is in the
       * bundle. It is the default direction's background, and `ui/theme.ts`
       * writes the resolved one over it at boot.
       *
       * **AND IT WAS THE WRONG DIRECTION** (2026-09-02). It said `#0a0806`
       * under exactly the sentence above, and `#0a0806` is TORCHLIT's ground —
       * `DEFAULT_THEME_ID` moved to `settlement` and this did not follow. The
       * manifest and the `theme-color` above both already say `#14100c`; these
       * two literals were simply missed, so every cold load painted a darker
       * ground than the game it was about to show and the bundle repainted it
       * a shade lighter as it arrived. A flash on the first frame of the first
       * minute, which is the frame the stranger test starts on.
       *
       * The same shape as the `destinationAt` docblock: a comment asserting an
       * invariant is not the invariant, and it is the sentence that stops a
       * reader checking.
       */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14100c;
      }
      body {
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #e8d6ae;
          font-family: Georgia, serif;
          padding: 24px;
          text-align: center;
          margin: 0;
        "
      >
        Ashwake est un jeu, et il a besoin de JavaScript pour se jouer.<br />Ashwake is a game, and
        it needs JavaScript switched on to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
