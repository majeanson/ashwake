name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # MOVED AHEAD OF THE BROWSERS (2026-09-11). It sat after `pnpm test:e2e`,
      # which is a step that can fail on a timing flake — and on 2026-09-11 it
      # did, three runs in a row, so the budget never ran and a 277 KB
      # first-paint regression shipped to main under a red tick that said
      # nothing about bytes. A byte count needs only `dist`, so it runs the
      # moment `dist` exists: exact, reproducible, and behind nothing that can
      # be flaky.
      # WHAT A PHONE DOWNLOADS, against a bar (2026-09-10, `PASS.md` P9).
      #
      # `IMPROVEMENTS.md` B8 measured this once, in prose, and nothing
      # re-measured any of it — while B8's own chunking ruling ends by saying
      # the cost of `three` riding in the door's chunk "shows up immediately as
      # the entry chunk's byte count jumping on the next build". That required a
      # watcher and there was none.
      #
      # A GATE rather than a report, unlike the sweep's first pass and unlike
      # the screen audit, and the difference is the one B8.6 itself drew: a byte
      # count is exact, reproducible on any machine, and does not depend on a
      # renderer. It runs AFTER the build, which produced `dist` above.
      #
      # It also fails on the renderer's module specifiers appearing in the entry
      # chunk, which catches a lazy boundary breaking by NAME on the build that
      # breaks it rather than by a byte count somebody notices later.
      - run: pnpm budget
      # The rules did not move: the harness in this repo must print exactly what
      # Ashwake 1's did. `sim.golden.txt` is that output, captured from
      # tiles@42d4da3 (v1.0.0) on 2026-08-28. A diff here is a rule that moved.
      - run: pnpm --filter @ashwake/core --silent sim > sim.out.txt && diff -u packages/core/sim.golden.txt sim.out.txt
      # THE SIX RITUALS, AS A GATE (2026-09-10, `PASS.md` P1 → P10).
      #
      # `pnpm sweep` runs every ritual in CLAUDE.md and exits non-zero on a
      # finding, on a ruling that matches nothing, or on a ruling past its
      # `until`. P1 set the bar for making it blocking — one clean run with an
      # empty allowlist delta — and P1.9's adjudication cleared it: 330
      # findings to 0, 91 rulings, nothing orphaned.
      #
      # The `git diff` is the same move as the golden sim above, for the same
      # reason: SWEEP.md in the repository is what a reader trusts, so a report
      # nobody regenerated fails here rather than going quietly stale. A tool
      # that grades its own output is not a check.
      - run: pnpm sweep
      - run: git diff --exit-code -- SWEEP.md
      # THE COMMITTED ART IS CURRENT — and this must run BEFORE the bake,
      # because the bake overwrites the very files it grades.
      #
      # This step is the closure of a hole this file admitted at length from
      # 2026-08-29 until 2026-09-08. The argument for the hole was sound —
      # `sharp` does not rasterise SVG byte-identically across platforms, so a
      # Linux runner can never diff its bake against a Windows one, and the
      # first version of the step below did exactly that and failed for that
      # reason alone. The consequence was not sound: nothing checked the PNGs
      # actually in the repository, and Ashwake 1 proved that is not
      # hypothetical — it darkened daylight's terrain ladder on 2026-08-28,
      # never re-baked, and shipped art rendering the OLD ladder, which this
      # body then inherited.
      #
      # `scripts/artcheck.ts` is the portable version this file asked for: a
      # measured ladder derived from the THEME, committed as
      # `apps/game/public/assets/ladder.json`, graded against the committed
      # PNGs. It rasterises nothing. It compares the theme's own arithmetic
      # exactly, and re-DECODES the committed bytes — deterministic where
      # rasterising is not — so it is as true on this runner as on the machine
      # that baked. See that file for what each column catches.
      - run: pnpm artcheck
      # The art can still be BAKED, and the baking still agrees with the L* test.
      #
      # `scripts/terrain.ts` throws if the baked greyscale ordering contradicts
      # the token ordering `theme.test.ts` enforces, so running it here grades
      # the live palette through the renderer rather than through its numbers
      # alone — and it keeps the pipeline itself from rotting unnoticed, which
      # is how it came to be missing from this body in the first place.
      #
      # It still deliberately does NOT diff the result against the committed
      # PNGs, for the cross-platform reason above. That is no longer a gap;
      # it is a division of labour with the step before it.
      - run: pnpm bake

  # THE BROWSERS, IN A JOB OF THEIR OWN (2026-09-11, Marc: "separate e2e and
  # deploy jobs").
  #
  # It was the tail of `ci`, so every flake in it was also a deploy that did
  # not happen: five runs in one evening went red here and the deploy was
  # skipped five times, while not one of the failures was the game — a picture
  # read a frame early, and a precondition that depended on whether the browser
  # had logged an error. Six commits sat unreleased behind two timing bugs in
  # the instrument.
  #
  # So it becomes B8.6's other kind of thing: **a report somebody reads, not a
  # gate**, which is the same ruling the screen audit and the perf report ship
  # under. It still runs on every push, still goes red in the open, and still
  # keeps its screenshots — what it no longer does is decide whether a build
  # reaches a phone. What DOES decide that is everything in `ci`: the format,
  # the types, 1288 unit tests, the golden sim, the six rituals, the byte
  # budget and the art check, all of them exact and none of them holding a
  # browser.
  #
  # The cost is stated plainly rather than hidden: this job is the only thing
  # in the repository that renders WebGL for real, so a renderer that crashes
  # on boot can now reach production with a red tick beside it. The guard is
  # that it is red IN PUBLIC and on the same commit — and `verify:deploy`
  # runs against the live site after every deploy.
  #
  # It installs and builds for itself because jobs share no filesystem;
  # `pnpm test:e2e` already builds.
  e2e:
    runs-on: ubuntu-latest
    # AND A CEILING, because this job hung for sixty-nine minutes (2026-09-12).
    #
    # It printed all 134 chromium results at 22:57:00 and did not exit until
    # 00:06:05. The cause is fixed where it belongs — `quota.spec.ts` wrote a
    # 1,048,576-character assertion message to stdout and the runner stopped
    # draining the pipe — but the CLASS of fault is "a browser suite stops
    # making progress", which no amount of care in one spec rules out.
    #
    # A green run is seven minutes and the slowest red one was fourteen, so
    # twenty-five is a ceiling no honest run can reach. This is not a gate
    # (the ruling of 2026-09-11 stands) — it is the difference between a
    # report that is red in fifteen minutes and one nobody has yet.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TWO engines since 2026-09-08. WebKit is the one the game is actually
      # played in — `CLAUDE.md`'s testing rule is a phone, in portrait — and
      # every spec in this repository had run in Chromium alone. The split of
      # which specs run where, and why, is argued in `playwright.config.ts`.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      # WHAT THE FAILING BROWSER SAW (2026-09-11).
      #
      # Three runs failed in one evening and every one of them left this
      # repository nothing but a sentence: no screenshot, no page snapshot, no
      # trace. `board.spec.ts`'s centring check reads a PICTURE and reports a
      # boolean, so "the daily opened on empty ground" is unanswerable from a
      # log — and it failed only on the runner's Linux WebKit, which is not a
      # browser this machine can run. An instrument that grades a picture must
      # hand the picture over when it fails. It answered on its first red run.
      #
      # `if: failure()` so a green run uploads nothing, and seven days because
      # this is evidence for the session that follows the failure, not an
      # archive.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # No PR gate: land on main, and CI gates the prod deploy — `ci`, which is
  # every exact check there is, and NOT `e2e`, which runs beside it as a
  # report (see that job for the ruling and its cost). Set the
  # DEPLOY_ENABLED repository variable to 'true' to arm this job, and the
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets to authorise it —
  # the same two Ashwake 1 uses; the token's scope already covers a second
  # Worker on the same zone.
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "DEPLOY_FALLBACK_URL=$url" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Green CI is not a deploy. Ashwake 1's verifier, ported: /version.json
      # must report THIS commit, every hashed bundle the live index references
      # must serve as a file rather than as the SPA fallback, and so must the
      # board's font — Stage 2 learned that a font that cannot load is a board
      # that cannot draw. Falls back to the workers.dev host of the same worker
      # only when Cloudflare marks the 403 as its own bot challenge.
      - name: Verify
        run: pnpm verify:deploy
