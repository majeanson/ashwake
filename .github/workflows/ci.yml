name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The real-browser smoke: headless Chromium over the BUILT bundle, WebGL
      # rendering for real — the canary for the renderer-crash class the unit
      # suite cannot see.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The rules did not move: the harness in this repo must print exactly what
      # Ashwake 1's did. `sim.golden.txt` is that output, captured from
      # tiles@42d4da3 (v1.0.0) on 2026-08-28. A diff here is a rule that moved.
      - run: pnpm --filter @ashwake/core --silent sim > sim.out.txt && diff -u packages/core/sim.golden.txt sim.out.txt
      # The ART still matches the THEME it was baked from.
      #
      # `scripts/terrain.ts` reads colour off the theme objects rather than a
      # copied palette, so re-baking is idempotent until a palette moves — and
      # then the committed PNGs are stale and nothing says so. Ashwake 1 proved
      # that is not hypothetical: it darkened daylight's terrain ladder on
      # 2026-08-28 to fix "ember has no contrast", never re-baked, and shipped
      # art rendering the OLD ladder. This body then inherited the stale files
      # as frozen copies, which is how a contrast fix goes missing twice.
      #
      # The bake also carries its own guardrail — it throws if the baked
      # greyscale ordering contradicts the token ordering the L* test enforces
      # — so this one step checks both that the art is current and that it is
      # still legible in the order the palette promises.
      - run: pnpm bake && git diff --exit-code -- apps/game/public

  # No PR gate: land on main, and CI gates the prod deploy. Set the
  # DEPLOY_ENABLED repository variable to 'true' to arm this job, and the
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets to authorise it —
  # the same two Ashwake 1 uses; the token's scope already covers a second
  # Worker on the same zone.
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "DEPLOY_FALLBACK_URL=$url" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Green CI is not a deploy. Ashwake 1's verifier, ported: /version.json
      # must report THIS commit, every hashed bundle the live index references
      # must serve as a file rather than as the SPA fallback, and so must the
      # board's font — Stage 2 learned that a font that cannot load is a board
      # that cannot draw. Falls back to the workers.dev host of the same worker
      # only when Cloudflare marks the 403 as its own bot challenge.
      - name: Verify
        run: pnpm verify:deploy
